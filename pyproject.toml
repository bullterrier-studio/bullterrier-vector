[project]
name = "bullterrier-vector"
dynamic = ["version"]  # maturin reads it from Cargo.toml's [workspace.package]
description = "A typography-first vector graphics scripting library: pictures written as code, drawn as SVG or pixels, the same from Rust, Python and the browser."
readme = "README.md"
license = "MIT AND OFL-1.1"  # the code is MIT; the bundled fonts are SIL Open Font License 1.1
license-files = ["LICENSE", "crates/core/fonts/*/OFL.txt"]  # each bundled font's licence text
authors = [
    { name = "Janis Cakstins", email = "janis.cakstins@gmail.com" }
]
# 3.12 is the oldest version the code needs; the extension is built once per platform (abi3-py312) for every later one.
requires-python = ">=3.12"
keywords = [
    "generative art", "typography", "vector graphics", "svg", "creative coding", "pen plotter", "variable fonts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/bullterrier-studio/bullterrier-vector"
Issues = "https://github.com/bullterrier-studio/bullterrier-vector/issues"

# maturin builds the Rust extension `bullterrier_vector._native._core` (crates/python) and packs it with the Python
# code of src/
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "src"
module-name = "bullterrier_vector._native._core"
# a build from the sdist under rustup uses the toolchain CI tests and the wheels are built with; maturin ships only the
# crates the extension depends on, and the sdist is the whole workspace (`check_dists.py` wants every member's manifest)
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "crates/wasm/Cargo.toml", format = "sdist" },
    { path = "crates/wasm/src/**/*.rs", format = "sdist" },
]

# `uv sync` and `uv run` rebuild the extension when one of these changes (by default uv looks at pyproject.toml only)
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.poe.tasks]
# A fast pure-Python scan of the tracked files: no .py or .rs file over 1000 lines, no test file over 1500, and the files
# listed in [tool.file-size.exempt] never grow. tests/tools/test_file_size_gate.py shows it failing.
file-size = { cmd = "python tools/check_file_size.py", help = "Check that no tracked Python or Rust file is over 1000 lines (test files 1500); listed exceptions may not grow" }
# The font crates are built without `std`, so that their maths is libm's and not the platform's (same outline bytes
# natively and in WebAssembly): cargo unifies features across the workspace, so one dependency asking for `std` would
# switch it on. tools/check_font_features.py reads `cargo tree`; tests/tools/test_rust_gates.py shows it failing.
rust-fonts = { cmd = "python tools/check_font_features.py", help = "Check that the font crates (read-fonts, harfrust) are not built with their std feature" }
# The core must also build for the browser with its bindings crate (the template's rust-wasm checks the core alone).
wasm-build = { cmd = "cargo build -p bullterrier-vector -p bullterrier-vector-wasm --target wasm32-unknown-unknown --locked --quiet", help = "Build the core and the WebAssembly bindings for WebAssembly (wasm32-unknown-unknown)" }
# A release build, then the glue (`wasm-bindgen`, pinned in Cargo.toml) into the ignored pkg/, then Node runs tests/wasm
# against what the native extension answers (tests/wasm/oracle.py). simd128 is for this build step only, never a config
# file, never a native build: it makes the rasteriser 10-15x faster than scalar WebAssembly.
# tests/tools/test_wasm_gate.py shows the task failing.
wasm-test = { sequence = [
    { cmd = "cargo build -p bullterrier-vector-wasm --target wasm32-unknown-unknown --release --locked --quiet", env = { RUSTFLAGS = "-C target-feature=+simd128" } },
    "wasm-bindgen --target nodejs --out-dir pkg ${CARGO_TARGET_DIR:-target}/wasm32-unknown-unknown/release/bullterrier_vector_wasm.wasm",
    "python tests/wasm/oracle.py pkg/oracle.json",
    "node --max-old-space-size=2048 --test tests/wasm/",  # a runaway test dies at 2 GB of JavaScript heap, not at the machine's
], default_item_type = "cmd", help = "Build the WebAssembly package (simd128), run it in Node and compare it with the native extension" }
# The stack tests (crates/core/tests/stack.rs) unoptimised, so the 256 KB stack bound is proved on the largest frames.
rust-test-stack = { cmd = "python tools/run_capped.py -- cargo test -p bullterrier-vector --profile stack --test stack --locked --quiet", help = "Run the stack tests unoptimised under the memory cap" }
# Not a gate: draw a drawing file (.json, or a .py that leaves `drawing`) to dist/look/<name>.png and .svg, to open and
# look at: `uv run poe look examples/star.py [--size 800x600] [name=value ...]`; poe hands everything after the task name
# to the tool. tests/tools/test_look.py shows it working and failing.
look = { cmd = "uv run python tools/look.py", help = "Draw a .json or .py drawing to dist/look/<name>.png and .svg: look FILE [--size WxH] [name=value ...]" }
# Not a gate and not in `check` or `fast`: time `to_rgba` and `to_mesh` on one reference drawing, natively and (after
# `poe wasm-test` built pkg/) in Node, and print a table: `uv run poe bench [--shapes N] [--size WxH] [--repeats N]
# [--warmups N] [--require-node]`. Nothing asserts on time; the numbers are recorded by hand in docs/benchmarks.md.
# tests/tools/test_bench.py shows it working and failing.
bench = { cmd = "uv run python tools/bench.py", help = "Time to_rgba and to_mesh on the reference drawing, native and in Node: bench [--shapes N] [--size WxH] [--repeats N] [--require-node]" }
# PYTHONWARNDEFAULTENCODING makes the interpreter, and every xdist worker it starts, report text IO without an
# encoding (EncodingWarning), which `filterwarnings` below turns into a failure; an -X flag would not reach the workers
# Three tiers (docs/rules.md, "Three tiers"): `fast` while working, `check` before a push to main, `full` before a tag and in CI. The tests that
# prove a gate fails on a known-bad input copy the workspace and build in it (marked `gate`), and the shared tools' own tests are the
# same in every project (marked `tooling`): `test` is the project's own suite, and `gate-tests` runs both when the tooling changed.
test = { cmd = "python tools/run_capped.py -- pytest -q -n auto -m 'not gate and not tooling'", env = { PYTHONWARNDEFAULTENCODING = "1" }, help = "Run the project's test suite on every CPU core (pytest-xdist; the order stays random), without the tests of the tooling" }
gate-tests = { cmd = "python tools/run_capped.py -- pytest -q -n auto -m 'gate or tooling'", env = { PYTHONWARNDEFAULTENCODING = "1" }, help = "Run the tests of the tooling: the proofs that each gate fails on a known-bad input, and the shared tools' own tests" }
# Not part of `check`: it asks the PyPI vulnerability database about every locked package (runtime, extras and dev
# tools, pinned by hash), so it needs the network and its verdict changes as advisories are published. For CI and
# before a release; an advisory with no fixed release is ignored with `--ignore-vuln ID` and listed in SECURITY.md.
# The Rust crates in Cargo.lock are checked by cargo-deny against the RustSec advisory database, likewise online.
audit = { sequence = ["uv export --frozen --all-extras --all-groups --no-emit-project --quiet --output-file dist/audit/requirements.txt", "pip-audit --requirement dist/audit/requirements.txt --disable-pip --require-hashes --progress-spinner off", "cargo deny --locked check advisories"], default_item_type = "cmd", help = "Check every locked dependency (Python and Rust) against known vulnerabilities (needs the network)" }
fix = { sequence = ["ruff check --fix .", "ruff format .", "cargo fmt --all"], default_item_type = "cmd", help = "Apply every automatic lint and format fix" }
# The sdist and wheel as PyPI would get them, built into dist/check (git-ignored, emptied first) and checked as CI checks
# every platform's: tools/check_dists.py (twine, one build of the extension, check-wheel-contents)
build-check = { sequence = ["uv build --quiet --clear --no-create-gitignore --out-dir dist/check", "python tools/check_dists.py dist/check"], default_item_type = "cmd", help = "Build the sdist and wheel and check what would be uploaded" }
# The GitHub workflows and dependabot.yml: actionlint (syntax, expressions, job wiring; it also runs shellcheck on the
# `run:` scripts when shellcheck is installed, as on GitHub's runners) and zizmor (unpinned actions, template
# injection, persisted credentials, over-broad permissions). `uv run`, because the actionlint-py distribution names
# its program differently. zizmor stays offline so the gate needs no network; its online audits need a GitHub token.
lint-workflows = { sequence = ["uv run actionlint", "zizmor --offline .github"], default_item_type = "cmd", help = "Lint the GitHub workflows (actionlint, zizmor)" }
# The Rust gates, each beside its Python counterpart; cargo comes with rustup, at the version rust-toolchain.toml pins.
# Warnings fail only here (`-D warnings`), never a user's build. tests/tools/test_rust_gates.py shows each one failing.
# rustfmt follows `mod` but not `include!`: a file pulled in with `include!` is never checked unless it is named here (add it to this
# task, as `rustfmt --check <file>`).
rust-fmt = { cmd = "cargo fmt --all --check", help = "Check the Rust formatting (rustfmt.toml)" }
rust-lint = { cmd = "cargo clippy --workspace --all-targets --locked --quiet -- -D warnings", help = "Lint the Rust code: clippy and the determinism rules (clippy.toml), dead code, missing docs, unreachable pub, unsafe ([workspace.lints] in Cargo.toml)" }
rust-doc = { cmd = "cargo doc --workspace --no-deps --locked --quiet", env = { RUSTDOCFLAGS = "-D warnings" }, help = "Build the Rust documentation; any rustdoc warning (a broken link) fails" }
rust-tools = { cmd = "python tools/rust_tools.py check", help = "Check that the cargo tools the gate runs are installed at the versions Cargo.toml pins" }
rust-shear = { cmd = "cargo shear", help = "Find Rust dependencies no code uses (cargo-shear)" }
rust-deny = { cmd = "cargo deny --offline --locked check bans licenses sources", help = "Check the Rust dependencies offline: banned crates, licences, sources (deny.toml)" }
# The core is pure Rust so that it also runs in a browser (WebAssembly): only the core crate, which has no Python in it
rust-wasm = { cmd = "cargo check -p bullterrier-vector --target wasm32-unknown-unknown --locked --quiet", help = "Check that the core builds for the browser (wasm32-unknown-unknown)" }
stubtest = { cmd = "python -m mypy.stubtest --mypy-config-file pyproject.toml bullterrier_vector._native._core", help = "Check the stub _core.pyi against the built extension" }
rust-test = { cmd = "python tools/run_capped.py -- cargo test --workspace --locked --quiet --no-fail-fast", help = "Run the Rust tests under the memory cap, every binary even after one fails" }
# A crate's Rust integration tests are one binary (tests/it/main.rs); tools/check_rust_test_layout.py, the table [tool.rust-tests.own-binaries]
rust-test-layout = { cmd = "python tools/check_rust_test_layout.py", help = "Check that the Rust integration tests are one binary per crate (tests/it/)" }
dead-code = { cmd = "vulture src", help = "Find dead code in src (vulture)" }
# The project's own gates (vector: file size, the font crates without std, the WebAssembly bindings and their Node tests, the
# stack tests unoptimised). `check` and `full` run this last; tests/tools/test_*_gate.py show each failing.
project-gates = { sequence = [{ ref = "file-size" }, { ref = "rust-fonts" }, { ref = "wasm-build" }, { ref = "rust-test-stack" }, { ref = "wasm-test" }], help = "Vector's own gates, run last by check and full" }
# The steps only `full` runs: after build-check, whose dist/check it reads. tests/tools/test_check_dist_contents.py shows it failing.
dist-contents = { cmd = "python tools/check_dist_contents.py dist/check", help = "Check the sdist's Rust sources and the licence files of the sdist and wheels (fonts included)" }
project-full = { sequence = [{ ref = "dist-contents" }], help = "Vector's own steps that only full runs" }
# The steps `check` and `full` share, cheapest first, stopping at the first failure
gates = { sequence = ["ruff format --check .", { ref = "rust-fmt" }, "ruff check .", { ref = "rust-lint" }, { ref = "lint-workflows" }, { ref = "dead-code" }, { ref = "rust-doc" }, "deptry .", { ref = "rust-tools" }, { ref = "rust-test-layout" }, { ref = "rust-shear" }, { ref = "rust-deny" }, { ref = "rust-wasm" }, "mypy", { ref = "stubtest" }, { ref = "rust-test" }, { ref = "test" }, { ref = "project-gates" }], default_item_type = "cmd", help = "Every gate except the proofs that each gate can fail (format, lint, workflows, dead code, docs, dependencies, types, tests, the project's own)" }
fast = { sequence = ["ruff format --check .", { ref = "rust-fmt" }, "ruff check .", { ref = "rust-lint" }, "mypy", { ref = "test" }], default_item_type = "cmd", help = "The inner loop: format, lint, types and the quick tests; no build, no Rust tests, no proofs" }
# A pass on a clean tree is remembered with its tier, so pushing exactly that tree does not repeat it; `check` runs the proofs only when the
# change since they last passed touches what they test ([tool.gate-proofs] below), `full` always
proofs = { cmd = "python tools/pre_push.py proofs", help = "Run the gate proofs if the change touches what they test (or they never passed here)" }
check = { sequence = ["python tools/pre_push.py start", { ref = "gates" }, { ref = "proofs" }, "python tools/pre_push.py pass check"], default_item_type = "cmd", help = "The gate before a push to main: every gate, and the proofs when the change touches what they test; a pass is remembered for that tree" }
full = { sequence = ["python tools/pre_push.py start", { ref = "gates" }, { ref = "build-check" }, { ref = "gate-tests" }, { ref = "project-full" }, "python tools/pre_push.py pass full"], default_item_type = "cmd", help = "The gate before a tag and in CI: `check`, the build of the sdist and the wheel, the proofs always, and the project's own full-only steps; a pass is remembered for that tree" }
# `default_install_hook_types` in .pre-commit-config.yaml names the three hook types, so a bare `install` covers them
setup = { sequence = ["pre-commit install --install-hooks", "git config --local commit.template .gitmessage", "python tools/rust_tools.py install"], default_item_type = "cmd", help = "Install the git hooks, the commit-message template and the cargo tools the gate runs (once per clone)" }


# Read by tools/check_commit_message.py (the commit-msg hook): Conventional Commits 1.0 with these limits.
[tool.commit-message]
types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
header-max-length = 72
body-max-line-length = 100
scope-pattern = "^[a-z0-9][a-z0-9/_-]*$"

# Read by tools/run_capped.py: the memory cap (MB, summed over a command's whole process group) the poe tasks that run
# tests go through, so a runaway test fails the gate instead of freezing the machine. 8000: the million-shape tests of
# crates/core/tests/drawing_limits.rs peak at 2.8 to 4.0 GB (a gate run was killed at 4003 MB under a 4000 cap); a
# runaway still stops well below the 24 GB of the machine
[tool.run-capped]
cap-mb = 8000

# The system tools the gates run that are not dev dependencies (tests/tools/test_project_wiring.py): Node runs the
# WebAssembly package's tests.
[tool.project-wiring]
system-commands = ["node"]

# Read by tools/check_rust_test_layout.py: the Rust test files that are binaries of their own (path -> why they need a
# process to themselves). Every other integration test is a module of tests/it/.
[tool.rust-tests.own-binaries]
"crates/core/tests/stack.rs" = "256 KB thread stacks, built with its own profile (`stack`: unoptimised), so that the stack bound is proved on the largest frames"
"crates/core/tests/drawing_limits.rs" = "peak memory of 3 to 5 GB (a million shapes, twice): a process keeps what it allocated, so the other tests would share it"

# Read by tools/pre_push.py (`poe proofs`, the last step of `poe check`): the gate proofs (tests marked `gate`) run in `check` only when the
# change since they last passed touches one of these globs, relative to the repository root, or when they never passed here. List every file a proof
# copies or matches the text of; not one it only appends to (that cannot break it, and the project's own source changes often, which
# would run the slow proofs every time). `poe full` runs them always.
[tool.gate-proofs]
triggers = [
    "pyproject.toml",
    ".pre-commit-config.yaml",
    "rustfmt.toml",
    "deny.toml",
    "rust-toolchain.toml",
    "Cargo.toml",
    "Cargo.lock",
    "crates/*/Cargo.toml",
    "tools/*",
    "tests/tools/*",
    ".github/*",
]
# The project's own: files its own proofs copy or match (the template never changes this line)
project-triggers = [
    "tests/wasm/*",
    "tests/conftest.py",
    "examples/star.py",
    "crates/core/examples/star.rs",
    "crates/wasm/examples/star.mjs",
    "crates/wasm/src/lib.rs",
    "crates/core/fonts/*",
    "src/bullterrier_vector/_native/_core.pyi",
    "src/bullterrier_vector/py.typed",
    "docs/examples/json/*",
    "uv.lock",
    "clippy.toml",
    ".gitignore",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test files are named after the module they test, so equal names in different folders must never collide
# a misspelt marker or option is an error, not a silently ignored typo
# with xdist (`-n`), all the tests of a file run on one worker (loadfile), so an expensive module fixture is built once;
# not `loadgroup`: pytest 9.2 broke xdist 3.8's `xdist_group` (it renames
# `item._nodeid`, which pytest no longer reads), so every group was silently spread over the workers
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "--dist=loadfile"]
markers = [
    "gate: proves a gate fails on a known-bad input in a copy of the workspace; slow, so `poe test` and `poe check` leave it out unless the change touches [tool.gate-proofs]; `poe gate-tests` and `poe full` run it",
    "control: a gate proof's known-good side (the gate passes on the unchanged copy); `check` leaves it to `full`, which runs every proof",
    "tooling: tests a shared tool of the template (the same file in every project, tested in the template too); `poe test` leaves it out, `poe gate-tests` runs it with the proofs",
    "typecheck: type-checks the package with mypy",
]
# an xfail that starts passing fails the run, so the marker cannot outlive the bug it names
xfail_strict = true
# Every warning fails the test that raised it: a leaked file or process (ResourceWarning), a deprecated call, and, when
# PYTHONWARNDEFAULTENCODING=1 is set, text IO that relies on the locale's encoding (EncodingWarning, PEP 597).
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Preview for the linter only (the formatter keeps its stable style), and only for the preview rules listed by code
# in `select` (PLC2701, PLW1514), never a whole preview family.
preview = true
explicit-preview-rules = true
# Opinionated enough to keep the code consistent, typed and documented; not so strict that it blocks progress.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PIE", "RET", "PERF", "RUF", "PT", "DTZ", "T20",
    "PLE", "PLW",
    "ANN",  # type hints on public functions
    # docstrings on every PUBLIC module, class, method, function and package (a leading _ exempts a name); none empty
    "D100", "D101", "D102", "D103", "D104", "D106", "D419",
    # security (flake8-bandit): shell commands, pickle, yaml.load, eval/exec, hard-coded secrets, unchecked URL schemes,
    # insecure temp files and hashes, assert in library code. A subprocess call (S603) carries a `# noqa` saying why
    # its argv is safe.
    "S",
    "SLF001",  # private-member access: applies to tests too, which must not reach into the implementation
    "PLC2701",  # import of a private name (a preview rule, turned on alone by explicit-preview-rules)
    # a `# type: ignore` names its error code and a `# noqa` its rule (RUF100, in RUF, fails an unused `# noqa`)
    "PGH",
    "LOG",  # logging misuse (the root logger, a logger made by hand), should anything here ever log
    # text files opened without `encoding=` use the locale's, which breaks non-ASCII names on Windows (preview)
    "PLW1514",
    "BLE",  # `except Exception` hides bugs; catch what can happen, or say why everything must be caught
    "PTH",  # pathlib, not os.path / open() / glob: one way to handle paths
    "PYI",  # type stubs (the Rust extension's, `_core.pyi`) written as stubs: no bodies, no docstrings
]
# Deliberately NOT enabled: TRY003 / EM (message-style noise); the docstring style rules D2xx / D4xx beyond D419 (we
# enforce presence, not formatting); TID252 (relative imports are fine inside the package). Also off, because the
# package is a thin layer over the Rust core and no code here needs them yet: the PLR family (magic numbers, argument
# and branch counts), FBT (boolean arguments) and PLC0415 (imports inside functions); turn one on when a case appears.
# Ignored: ANN202 (private-function return types are mypy's job), ANN401 (Any is sometimes right), RUF001-003
# (unicode in strings, docstrings and comments is wanted), PLW2901 (rebinding a loop variable is a clear idiom).
ignore = ["ANN202", "ANN401", "RUF001", "RUF002", "RUF003", "PLW2901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from annotations, docstrings, PLW, naming and assert-False; NOT from SLF001 / PLC2701, on purpose: a
# test must not reach into the implementation. Of bandit only these: assert is how pytest checks (S101), and a test
# runs our own interpreter and the developer's tools (python, git, uv) with argv it wrote itself (S603, S607).
"tests/**" = ["ANN", "D", "S101", "S603", "S607", "PLW", "N", "B011"]
# scripts run by hand (the cargo-tools check): printing is their output
"tools/**" = ["T20"]
"**/__init__.py" = ["F401"]

# `uv run mypy` checks src, tests, tools and examples; the gate (`poe check`) and the pre-push hook run it.
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools", "examples"]
# tests/ has no __init__.py (pytest imports it with importlib), so equal test file names in different folders need
# module names from their paths: tests/test_errors.py is tests.test_errors, src/bullterrier_vector/errors.py is
# bullterrier_vector.errors.
explicit_package_bases = true
mypy_path = "src,tools"  # a tool imports its sibling (release.py imports check_release)
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# fontTools and brotli ship no type information; fontTools is the test oracle for fonts (tests/test_text.py) and its
# values are used as `Any`; brotli writes the WOFF2 streams of tests/test_font_containers.py
[[tool.mypy.overrides]]
module = ["fontTools.*", "brotli"]
ignore_missing_imports = true

# Read by tools/check_dists.py (`poe build-check`): each wheel holds exactly src/bullterrier_vector minus these, plus its
# own build of the extension, so a shipped test or stray file fails (W102), and so does package code left out of the
# wheel (W101: py.typed and the stub included).
[tool.check-wheel-contents]
package = "src/bullterrier_vector"
package_omit = ["__pycache__", "*.pyc", ".*", "test_*.py"]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "brotli>=1.2.1",
    "check-wheel-contents>=0.6.3",
    "deptry>=0.25.1",
    "fonttools>=4.68.0",
    "hypothesis>=6.170.8",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "twine>=7.0.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.16",
    "zizmor>=1.31.1",
]

# Dead code fails the gate (`uv run poe dead-code`, in `poe check`). Only src is scanned: code that only tests use is
# dead, unless the public `__all__` lists it. 60 % is the level at which vulture reports unused functions,
# classes, methods and attributes, not just unused imports and unreachable lines. No exemptions yet: add a name or
# decorator here, with the framework that calls it, when one appears.
[tool.vulture]
paths = ["src"]
min_confidence = 60

# Every import is declared, and only once in the right place (`uv run deptry .`, in `poe check`): a missing, unused,
# transitive-only or development-only dependency fails. tests/ is not scanned (deptry's default).
[tool.deptry]
known_first_party = ["bullterrier_vector"]
