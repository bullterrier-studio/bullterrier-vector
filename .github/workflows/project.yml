# Vector's own CI jobs: the gates the template does not know (file size, the font crates without std, the WebAssembly
# bindings build, the stack tests unoptimised), as `poe project-gates` runs them locally, and `poe wasm-test`, which the local
# `check` leaves out (it is in `project-full`). ci.yml runs this
# file beside the template's checks, and ci-ok waits for it.
name: Project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  project-gates:
    name: Vector gates (file size, fonts, WebAssembly, stack tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      # rustup is on every runner; with no argument it installs the toolchain rust-toolchain.toml pins
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the cargo tools' versions are written once, in Cargo.toml's [workspace.metadata.tools]; the `wasm-bindgen`
      # command is one of them
      - name: Read the cargo tools' versions (Cargo.toml)
        id: cargo-tools
        run: echo "specs=$(uv run --no-project python tools/rust_tools.py specs)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: ${{ steps.cargo-tools.outputs.specs }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Fetch the locked crates (cargo fetch)
        run: cargo fetch --locked
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      - name: Vector's gates (poe project-gates)
        run: uv run --locked poe project-gates
      - name: The WebAssembly package in Node (poe wasm-test)
        run: uv run --locked poe wasm-test
