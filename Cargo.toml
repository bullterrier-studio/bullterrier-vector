# The Rust workspace of bullterrier-vector: `crates/core` (pure Rust: the core of the library; the crate
# `bullterrier-vector`), `crates/python` (its PyO3 bindings) and `crates/wasm` (its WebAssembly bindings). Rust
# settings live here, except what a tool cannot read from this file: rust-toolchain.toml, rustfmt.toml, deny.toml,
# clippy.toml.
[workspace]
resolver = "3"
members = ["crates/core", "crates/python", "crates/wasm"]

[workspace.package]
version = "0.0.0"  # the one version: the Python package reads it; crates.io gets it at the first release
edition = "2024"
rust-version = "1.99.1"  # the toolchain rust-toolchain.toml pins
license = "MIT AND OFL-1.1"  # the code is MIT; crates/core/fonts/ holds the bundled fonts, each with its OFL.txt
repository = "https://github.com/bullterrier-studio/bullterrier-vector"
publish = false  # until the first release (V22)

[workspace.dependencies]
bullterrier-vector = { path = "crates/core" }
libm = "0.2"
pyo3 = { version = "0.30", features = ["abi3-py312"] }
wasm-bindgen = "=0.2.130"  # exactly the version of the `wasm-bindgen` command below: generated glue must match it
proptest = "1.12"
roxmltree = "0.21"  # the SVG oracle of the output tests
# the SVG oracle of the output tests for what the XML cannot say, how the picture looks (a blur): renders an SVG so it can
# be compared with `to_rgba`; pinned exactly, because its edges may move a level; a dev-dependency of crates/core only
# (cargo-deny does not check dev-only licences: tiny-skia is BSD-3 and arrayref BSD-2). No default features: no text,
# no raster images, no system fonts
resvg = { version = "=0.49.0", default-features = false }
# the rasteriser (docs/design-decisions.md, "Rasteriser"): pinned exactly, because pixels are only required to look the
# same and a new release may move an edge by a level; vello_cpu is used only in crates/core/src/output/raster.rs, kurbo
# also in outline.rs and mesh.rs
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
kurbo = "=0.13.1"
# the PNG encoder (docs/design-decisions.md, "PNG"): pinned exactly, because its bytes may change between releases; it
# has no default features; used only in crates/core/src/output/png.rs
png = "=0.18.1"
# the mesh's fill tessellator (docs/design-decisions.md, "Mesh"): pinned exactly, because the triangles it makes are the
# mesh and a new release may make others; used only in crates/core/src/output/mesh.rs (`std` off: libm, no IO)
lyon_tessellation = { version = "=1.0.23", default-features = false }
# the font stack (docs/design-decisions.md, "Fonts"): pinned exactly, because a release may move an outline or a glyph
# run. `harfrust` shapes and reads fonts through `read-fonts`, which draws the outlines (the font model of 0.46 does
# it; `skrifa` is not needed). Neither has `std`, so that its maths is libm and not the platform's (the `rust-fonts`
# gate fails otherwise). Both are used only in crates/core/src/type/ (`harfrust` only in shaping.rs). Cargo.lock also
# lists the older `read-fonts` that `vello_common` names for a feature this workspace does not use; it is not built
read-fonts = { version = "=0.46.0", default-features = false, features = ["libm"] }
harfrust = { version = "=0.15.0", default-features = false, features = ["libm"] }
# SHA-256 of a font's bytes: the digest that names a font in a document and in the cache key; used only in
# crates/core/src/type/font.rs
sha2 = { version = "=0.11.1", default-features = false }
# WOFF2 unpacking (docs/design-decisions.md, "Fonts"): pinned exactly, because the bytes it makes are the font read;
# pure Rust with no `std`, so it runs the same in WebAssembly; WOFF (which needs its `z` feature) is not read. Used only
# in crates/core/src/type/unpack.rs
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }
# the boolean and offset engine (docs/design-decisions.md, "Booleans (V8)"): pinned exactly, because the contours it makes are the result
# of a boolean and a new release may order or snap them differently; no default features (none would be on: `rayon`,
# `glam` and `serde` stay off); used only in crates/core/src/path/boolean.rs and offset.rs
i_overlay = { version = "=9.1.0", default-features = false }

# The tessellator is optimised in debug builds too: the tests of the work limit make it do about a second of release-build
# work, which would take most of a minute unoptimised
[profile.dev.package.lyon_tessellation]
opt-level = 3

# Line tables are enough to read a backtrace, and no separate debug-info files are written: the build folder of the
# tests was 2.7 GB, now 0.9 GB (target/debug had grown to 44 GB of object files)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

# The Rust tests are optimised (opt-level 1): unoptimised, the million-shape and glyph tests took four to eight minutes
# of CPU, optimised under a minute (docs/design-decisions.md, "Optimised Rust tests"). Dependencies alone are not enough:
# the time is in this workspace's own code. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1

# For the stack tests alone (crates/core/tests/stack.rs, `poe rust-test`): the unoptimised build, whose frames are the
# largest, so that the 256 KB stack bound of rule 9 is proved on the worst case and not on optimised frames.
[profile.stack]
inherits = "dev"

# Warnings, not errors, so a newer compiler's new lint never breaks a user's install; the gate (`poe check`) runs clippy
# and rustdoc with `-D warnings`, so every one fails it.
[workspace.lints.rust]
missing_docs = "warn"  # ruff's D1xx: every public item is documented
unreachable_pub = "warn"  # `pub` only where a crate's users reach it; inside a crate, `pub(crate)`
unsafe_code = "deny"  # the core forbids it outright (`#![forbid(unsafe_code)]`); the bindings deny it too

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# restriction picks: no panicking shortcut (an error is returned), no printing (the library never prints)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

# The tools the gate runs that rustup does not install, each at the version the gate expects.
[workspace.metadata.tools]
cargo-shear = "1.14.0"
cargo-deny = "0.20.2"
wasm-bindgen = "0.2.130"  # the command (crate wasm-bindgen-cli); `rust-tools` ties it to the crate version in Cargo.lock
