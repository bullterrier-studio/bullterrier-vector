    { path = "std::fs::File::create", reason = "the core does no IO: callers pass bytes" },
    { path = "std::env::var", reason = "the core does no IO: callers pass bytes" },
]

# sqrt and mul_add stay allowed: IEEE 754 rounds them correctly on every target.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order varies by run; use BTreeMap/BTreeSet" },
    { path = "std::collections::HashSet", reason = "iteration order varies by run; use BTreeMap/BTreeSet" },
]
