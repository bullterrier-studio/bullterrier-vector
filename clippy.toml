    { path = "f32::powf", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::powi", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::cbrt", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::hypot", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "std::time::Instant::now", reason = "no clock: output depends only on inputs and the seed" },
    { path = "std::time::SystemTime::now", reason = "no clock: output depends only on inputs and the seed" },
    { path = "std::fs::read", reason = "the core does no IO: callers pass bytes" },
