# Clippy's rules for the determinism gate (docs/design-decisions.md, "Determinism is a gate") and for a core that does
# no IO. clippy reads these from this file and no other; `poe check` runs clippy with `-D warnings`.

disallowed-methods = [
    { path = "f64::sin", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::cos", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::tan", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::sin_cos", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::asin", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::acos", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::atan", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::atan2", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::sinh", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::cosh", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::tanh", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::exp", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::exp2", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::exp_m1", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::ln", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::ln_1p", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::log", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::log2", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::log10", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::powf", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::powi", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::cbrt", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f64::hypot", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::sin", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::cos", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::tan", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::sin_cos", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::asin", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::acos", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::atan", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::atan2", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::sinh", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::cosh", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::tanh", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::exp", reason = "platform maths differs between targets; use crate::math (libm)" },
    { path = "f32::exp2", reason = "platform maths differs between targets; use crate::math (libm)" },
